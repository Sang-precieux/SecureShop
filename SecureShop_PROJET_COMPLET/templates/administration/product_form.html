{% extends 'base.html' %}
{% block content %}<div class="page narrow"><div class="panel"><h1>{{ heading }}</h1>
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}<small>{{ field.help_text }}</small><div style="color:#b42323">{{ field.errors }}</div>{% endfor %}
<div class="row" style="margin-top:22px"><button class="btn" type="submit">Enregistrer</button><a href="{% url 'admin_products' %}">Annuler</a></div></form></div></div>{% endblock %}
